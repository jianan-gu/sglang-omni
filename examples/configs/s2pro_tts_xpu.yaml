config_cls: S2ProPipelineConfig
model_path: fishaudio/s2-pro

# Correctness-first Intel XPU baseline. Slow AR uses SGLang's XPU attention;
# Fast AR falls back to PyTorch SDPA instead of CUDA FA3/FlashInfer.
stages:
  tts_engine:
    engine:
      disable_cuda_graph: true
      enable_torch_compile: false
