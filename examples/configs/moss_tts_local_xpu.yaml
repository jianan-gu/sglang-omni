config_cls: MossTTSLocalPipelineConfig
model_path: OpenMOSS-Team/MOSS-TTS-Local-Transformer-v1.5

# Correctness-first Intel XPU baseline. The backbone and frame-local decoder
# run eagerly, while both codec instances use PyTorch SDPA. CUDA profiles keep
# their existing graph and packed-FlashAttention optimizations.
cuda_graph: false

stages:
  preprocessing:
    factory:
      attention_backend: sdpa
      max_concurrency: 1

  tts_engine:
    engine:
      disable_cuda_graph: true
      max_running_requests: 1
      max_total_tokens: 8192
      mem_fraction_static: 0.55

  vocoder:
    factory:
      attention_backend: sdpa
      stream_slots: 1
      max_batch_size: 1
